name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {} # manual redeploy; re-running a failed run collides with its old artifact

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy are separate jobs on purpose. In one job, deploy-pages lists
# the run's artifacts a fraction of a second after the upload finalizes and can
# find none (actions/deploy-pages#451); a second job looks seconds later.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # workflow_call: build the commit the caller just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true # always resolve the newest 26.x, not the runner's cached one
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble Pages artifact (app at the site root, puzzles alongside)
        run: |
          cp -r site/dist artifact
          mkdir -p artifact/puzzles
          if ls puzzles/*.json >/dev/null 2>&1; then cp puzzles/*.json artifact/puzzles/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
